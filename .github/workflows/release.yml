name: Release

# Automated release pipeline (single source of truth for versioning):
#   1. Analyzes Conventional Commits since the last `vX.Y.Z` tag.
#   2. Bumps `package.json` version, generates/updates CHANGELOG.md.
#   3. Commits the release bump, creates the `vX.Y.Z` git tag + GitHub Release.
#   4. Publishes the package to npmjs.org (with provenance).
#
# Manual `v*` tag pushes are handled separately by publish.yml, which is a
# recovery/back-fill path only. Tags created here by semantic-release use the
# workflow GITHUB_TOKEN, and GitHub deliberately does NOT cascade workflow runs
# for GITHUB_TOKEN-created events — so publish.yml is never double-triggered by
# this job. See README "Release Flow" for the full picture.
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Skip the release commit semantic-release itself pushes back to the branch.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package (emits JS + .d.ts)
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
